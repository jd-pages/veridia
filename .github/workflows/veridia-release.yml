name: VERIDIA Windows 发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: 版本升级类型
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: veridia-release
  cancel-in-progress: false

jobs:
  release:
    name: 测试、构建和发布
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: file:./release-e2e.db
      AUTH_SECRET: ci-only-auth-secret
      EXTENSION_TOKEN: local-extension-demo-token
      AI_ENABLED: "false"
      PLAYWRIGHT_BROWSER_CHANNEL: ""
      E2E_PORT: "3100"
      E2E_REUSE_SERVER: "false"
      RUST_LOG: info
      VERIDIA_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: 安装依赖
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
          Remove-Item Env:npm_config_ignore_scripts -ErrorAction SilentlyContinue
          npm ci --include=dev
          npm run electron:ensure

      - name: 准备并校验 Desktop bundled Node
        run: npm run desktop:node:prepare

      - name: 复用不可变测试基础设施缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/ms-playwright
            .playwright/e2e-template
            .playwright/next-e2e
            .next/cache
          key: ${{ runner.os }}-veridia-test-${{ hashFiles('package-lock.json', 'playwright.config.ts', 'prisma/schema.prisma', 'prisma/migrations/**', 'tests/e2e/setup-database.ts', 'scripts/testing/**') }}

      - name: 安装 Playwright Chromium
        run: npx playwright install chromium

      - name: 创建构建目录
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .ci, artifacts/release-logs | Out-Null

      - name: 计算发布版本
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            node scripts/ci-bump-version.mjs "${{ inputs.release_type }}"
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            "version=$version" >> $env:GITHUB_OUTPUT
            "tag=v$version" >> $env:GITHUB_OUTPUT
          } else {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $tag = "${{ github.ref_name }}"
            if ($tag -ne "v$version") {
              throw "Tag $tag 与 package.json 版本 $version 不一致"
            }
            "version=$version" >> $env:GITHUB_OUTPUT
            "tag=$tag" >> $env:GITHUB_OUTPUT
          }

      - name: 正式 FULL 门禁（不读取开发机凭证）
        shell: pwsh
        env:
          VERIDIA_DISABLE_ATTESTATION_WRITE: "true"
          VERIDIA_APP_VERSION: ${{ steps.version.outputs.version }}
          VERIDIA_BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: npm run verify:full *>&1 | Tee-Object artifacts/release-logs/verify-full.log

      - name: 准备桌面运行资源
        shell: pwsh
        run: npm run desktop:prepare *>&1 | Tee-Object artifacts/release-logs/desktop-prepare.log

      - name: 构建 NSIS 安装包和更新元数据
        shell: pwsh
        run: |
          npm run electron:assert *>&1 | Tee-Object artifacts/release-logs/electron-builder.log
          npx electron-builder --win nsis --publish never *>&1 | Tee-Object -Append artifacts/release-logs/electron-builder.log

      - name: 检查安装包 Prisma 运行文件
        shell: pwsh
        run: npm run prisma:assert-packaged *>&1 | Tee-Object artifacts/release-logs/prisma-packaged.log

      - name: 检查自动更新发布三件套
        shell: pwsh
        run: |
          node scripts/validate-software-release.mjs `
            --mode=LOCAL_BUILD `
            --directory=dist-installer `
            --tag-commit=${{ github.sha }} `
            --write-manifest=artifacts/release-manifest.json *>&1 |
            Tee-Object artifacts/release-logs/software-release-assets.log
          $notes = Get-Content CHANGELOG.md -Raw
          $autoUpdate = @'

          ## 自动更新文件

          本次软件更新包含自动更新所需文件：
          - 安装包 exe
          - blockmap
          - latest.yml

          客户端将通过 latest.yml 检测版本，并优先使用 blockmap 进行差分更新。
          '@
          Set-Content artifacts/software-release-notes.md ($notes + $autoUpdate) -Encoding utf8

      - name: 确认签名状态
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.WINDOWS_CSC_LINK }}")) {
            '未配置代码签名证书；本次为内部测试安装包，Windows 可能显示“未知发布者”。' |
              Tee-Object artifacts/release-logs/signing.log
          } else {
            "已提供 Windows 代码签名证书。" |
              Tee-Object artifacts/release-logs/signing.log
          }

      - name: 将手动发布版本写回 main
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): VERIDIA ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: 创建 Draft GitHub Release 并上传更新文件
        shell: pwsh
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            --draft `
            --title "VERIDIA ${{ steps.version.outputs.version }}" `
            --notes-file artifacts/software-release-notes.md `
            --repo "${{ github.repository }}" `
            "dist-installer/VERIDIA-Setup-${{ steps.version.outputs.version }}.exe" `
            "dist-installer/VERIDIA-Setup-${{ steps.version.outputs.version }}.exe.blockmap" `
            "dist-installer/latest.yml"

      - name: 校验 Draft Release 自动更新文件
        shell: pwsh
        run: |
          $draft = Join-Path $env:RUNNER_TEMP "veridia-draft-release"
          Remove-Item -LiteralPath $draft -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $draft | Out-Null
          gh release download "${{ steps.version.outputs.tag }}" --dir $draft --repo "${{ github.repository }}"
          node scripts/validate-software-release.mjs `
            --mode=REMOTE_DOWNLOAD `
            --directory=$draft `
            --manifest=artifacts/release-manifest.json `
            --tag-commit=${{ github.sha }}

      - name: 保留 Draft 等待 Binary Publish Resume
        shell: pwsh
        run: Write-Output "Draft Release 已通过内容身份校验；请使用上传发布包.bat 完成正式发布。"

      - name: 上传构建日志和安装产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veridia-release-${{ steps.version.outputs.version || github.run_number }}
          path: |
            artifacts/release-logs
            dist-installer/*.exe
            dist-installer/*.blockmap
            dist-installer/latest.yml
            artifacts/release-manifest.json
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30
