name: VERIDIA 代码检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: veridia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 分层验证门禁
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      AUTH_SECRET: ci-only-auth-secret
      EXTENSION_TOKEN: local-extension-demo-token
      AI_ENABLED: "false"
      PLAYWRIGHT_BROWSER_CHANNEL: ""
      RUST_LOG: info

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 准备并校验 Desktop bundled Node
        run: npm run desktop:node:prepare

      - name: 复用不可变测试基础设施缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/ms-playwright
            .playwright/e2e-template
            .playwright/next-e2e
            .next/cache
          key: ${{ runner.os }}-veridia-test-${{ hashFiles('package-lock.json', 'playwright.config.ts', 'prisma/schema.prisma', 'prisma/migrations/**', 'tests/e2e/setup-database.ts', 'scripts/testing/**') }}

      - name: 安装端到端测试浏览器
        run: npx playwright install chromium

      - name: 创建日志目录
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path artifacts/ci-logs | Out-Null

      - name: Pull Request 回归门禁
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: npm run verify:regression *>&1 | Tee-Object artifacts/ci-logs/verify-regression.log

      - name: main 正式 FULL 门禁
        if: github.event_name == 'push'
        shell: pwsh
        env:
          VERIDIA_DISABLE_ATTESTATION_WRITE: "true"
        run: npm run verify:full *>&1 | Tee-Object artifacts/ci-logs/verify-full.log

      - name: 上传检查日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veridia-ci-${{ github.run_number }}
          path: |
            artifacts/ci-logs
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
